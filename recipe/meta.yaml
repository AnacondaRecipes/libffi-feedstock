{% set name = "libffi" %}
{% set version = "3.8.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/libffi/libffi/releases/download/v{{version}}/libffi-{{version}}.tar.gz
  sha256: 7da3e2d9a171eb0a038f592ecad3ff2bb2550f3496d87b3b29ad0cf4430c0db4
  patches:
    - patches/win_cmake.patch                                                  # [win]
    - patches/fix_w3264_masm.patch                                             # [win]
    - patches/0001-arm64-use-a-dedicated-dylib-for-trampolines-so-it-ca.patch
    - patches/0002-Add-support-for-ffi_find_closure_for_code_np-on-Appl.patch
    - patches/0003-Don-t-define-FFI_COMPLEX_TYPEDEF-ifndef-FFI_TARGET_H.patch
    - patches/0004-LIBFFI_CLOSURE.patch                                        # [linux]

build:
  number: 0
  run_exports:
    # good history: https://abi-laboratory.pro/tracker/timeline/libffi/
    - {{ pin_subpackage('libffi', max_pin='x.x') }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - cmake                              # [win]
    - make                               # [unix]
    - autoconf                           # [unix]
    - libtool                            # [unix]
    - automake                           # [unix]

test:
  requires:
    - llvm-tools     # [win]
    - msys2-grep     # [win]
    - make # [unix]
    - cmake # [win]
    # no compile tests here, as used compiler might be not upward-compatible
    # needs to be fixed
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  source_files:
    - testsuite/libffi.bhaible
    - testsuite

about:
  home: https://sourceware.org/libffi
  license: MIT
  license_file: LICENSE
  license_family: MIT
  summary: A Portable Foreign Function Interface Library
  description: |
    The libffi library provides a portable, high level programming interface
    to various calling conventions. This allows a programmer to call any
    function specified by a call interface description at run-time.
  doc_url: https://sourceware.org/libffi
  dev_url: https://github.com/libffi/libffi

extra:
  recipe-maintainers:
    - stefan-balke
    - scopatz
    - isuruf
